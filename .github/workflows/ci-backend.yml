name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'multi-vendor-foodpanda-backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'multi-vendor-foodpanda-backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multi-vendor-foodpanda-backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'multi-vendor-foodpanda-backend/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma Client
      run: npx prisma generate
      
    - name: Lint
      run: npm run lint
      
    - name: Typecheck
      run: npm run typecheck
      
    - name: Build
      run: npm run build
